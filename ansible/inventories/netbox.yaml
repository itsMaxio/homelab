plugin: netbox.netbox.nb_inventory

validate_certs: false

config_context: true
# flatten_custom_fields: true
# flatten_config_context: true
group_names_raw: true
interfaces: true

group_by:
  - device_roles
  - platforms
  - tags

query_filters:
  - has_primary_ip: true
  - tag: ansible-managed
  - status: active

compose:
  ansible_user: config_context.ansible_user | default(omit)
  ansible_connection: config_context.ansible_connection | default(omit)
  ansible_become_method: config_context.ansible_become_method | default(omit)
  ansible_become_flags: config_context.ansible_become_flags | default(omit)
