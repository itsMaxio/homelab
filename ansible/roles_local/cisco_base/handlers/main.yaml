---
- name: Notify reload skipped
  ansible.builtin.debug:
    msg: "Reload skipped: 'cisco_base_reload_device' is false and 'force_reload' tag was not used. Reload manually to apply MTU changes."
  listen: Reload device
  when: not ((cisco_base_reload_device | default(false) | bool) or ('force_reload' in ansible_run_tags))
  tags: [always]

- name: Save configuration before reload
  cisco.ios.ios_config:
    save_when: always
  listen: Reload device
  when: (cisco_base_reload_device | default(false) | bool) or ('force_reload' in ansible_run_tags)
  tags: [always]

- name: Reload Cisco device
  cisco.ios.ios_command:
    commands:
      - command: "reload"
        prompt: "[confirm]"
        answer: "\r"
  listen: Reload device
  when: (cisco_base_reload_device | default(false) | bool) or ('force_reload' in ansible_run_tags)
  tags: [always]
