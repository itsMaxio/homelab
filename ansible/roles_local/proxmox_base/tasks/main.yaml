---
- name: "DEBUG : Proxmox API connection settings"
  ansible.builtin.debug:
    msg:
      - "api_host: {{ proxmox_api_host }}"
      - "api_port: {{ proxmox_api_port }}"
      - "api_user: {{ proxmox_api_user }}"
      - "api_password: {{ 'set' if proxmox_api_password | default('not set') }}"
      - "api_token_id: {{ proxmox_api_token_id }}"
      - "api_token_secret: {{ 'set' if proxmox_api_token_secret | default('not set') }}"
      - "validate_certs: {{ proxmox_api_validate_certs }}"
  tags: [never, debug]

- name: Proxmox API test and node role detection
  when: "'debug' not in ansible_run_tags"
  tags: [always]
  block:
    - name: Test Proxmox API
      community.proxmox.proxmox_cluster_status_info:
        api_host: "{{ proxmox_api_host }}"
        api_port: "{{ proxmox_api_port }}"
        api_user: "{{ proxmox_api_user }}"
        api_password: "{{ proxmox_api_password | default(omit, true) }}"
        api_token_id: "{{ proxmox_api_token_id | default(omit, true) }}"
        api_token_secret: "{{ proxmox_api_token_secret | default(omit, true) }}"
        validate_certs: "{{ proxmox_api_validate_certs }}"
      register: _proxmox_cluster_info
      delegate_to: localhost

    - name: Detect node role
      vars:
        _cluster_status: "{{ _proxmox_cluster_info.cluster_status }}"
        _is_cluster: "{{ (_cluster_status | selectattr('type', 'equalto', 'cluster') | list | length) > 0 }}"
        _online_nodes: "{{ _cluster_status | selectattr('type', 'equalto', 'node') | selectattr('online', 'truthy') | sort(attribute='nodeid') | list }}"
        _first_online_node: "{{ _online_nodes | first | default({}) }}"
        _local_node: "{{ _cluster_status | selectattr('local', 'truthy') | list | first | default({}) }}"
      ansible.builtin.set_fact:
        _proxmox_is_cluster: "{{ _is_cluster }}"
        _proxmox_is_primary_node: >-
          {{
            (not _is_cluster)
            or
            (_local_node.nodeid == _first_online_node.nodeid)
          }}

- name: "DEBUG : Cluster role"
  ansible.builtin.debug:
    msg:
      - "is_cluster: {{ _proxmox_is_cluster | default('not evaluated (debug mode)') }}"
      - "is_primary_node: {{ _proxmox_is_primary_node | default('not evaluated (debug mode)') }}"
  tags: [never, debug]
