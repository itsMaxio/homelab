---
- name: "DEBUG : ACME DNS plugin variables"
  ansible.builtin.debug:
    msg:
      - "plugin_name: {{ proxmox_acme_dns_plugin.name }}"
      - "plugin_type: {{ proxmox_acme_dns_plugin.type }}"
      - "plugin_data: {{ 'set' if proxmox_acme_dns_plugin.data | length > 0 else 'not set' }}"
  tags: [never, debug]

- name: Configure ACME DNS plugin
  community.proxmox.proxmox_acme_plugin_dns:
    name: "{{ proxmox_acme_dns_plugin.name }}"
    plugin: "{{ proxmox_acme_dns_plugin.type }}"
    data: "{{ proxmox_acme_dns_plugin.data }}"
  delegate_to: localhost
  no_log: true
  tags: [plugin]
