---
- name: "DEBUG : ACME certificate variables"
  ansible.builtin.debug:
    msg:
      - "target_node_name: {{ proxmox_acme_certificate.target_node_name }}"
      - "account_name: {{ proxmox_acme_certificate.account_name }}"
      - "domain: {{ proxmox_acme_certificate.domain }}"
      - "plugin_name: {{ proxmox_acme_certificate.plugin_name }}"
      - "force_renew: {{ proxmox_acme_certificate.force_certificate_renew }}"
  tags: [never, debug]

- name: Order ACME certificate
  community.proxmox.proxmox_acme_certificate:
    node_name: "{{ proxmox_acme_certificate.target_node_name | default(inventory_hostname) }}"
    account: "{{ proxmox_acme_certificate.account_name }}"
    domains:
      - domain: "{{ proxmox_acme_certificate.domain }}"
        plugin: "{{ proxmox_acme_certificate.plugin_name }}"
    force: "{{ proxmox_acme_certificate.force_certificate_renew | default(false) }}"
  delegate_to: localhost
  tags: [certificate]
