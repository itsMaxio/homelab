---
- name: "DEBUG : ACME account variables"
  ansible.builtin.debug:
    msg:
      - "account_name: {{ proxmox_acme_account.name }}"
      - "contact_email: {{ proxmox_acme_account.contact_email }}"
      - "account_type: {{ proxmox_acme_account.type }}"
  tags: [never, debug]

- name: Fetch existing ACME accounts
  community.proxmox.proxmox_acme_accounts_info:
  register: __proxmox_existing_acme_accounts
  delegate_to: localhost
  tags: [account]

- name: Manage ACME
  when: proxmox_acme_account.name not in (__proxmox_existing_acme_accounts.accounts | list)
  tags: [account]
  block:
    - name: Set ACME directory
      ansible.builtin.set_fact:
        __proxmox_acme_account_directory: "{{ _proxmox_acme_account_directories[proxmox_acme_account.type].directory }}"

    - name: Fetch ACME metadata
      ansible.builtin.uri:
        url: "{{ __proxmox_acme_account_directory }}"
        return_content: true
      register: __acme_directory_metadata
      delegate_to: localhost
      run_once: true

    - name: Set ACME TOS URL
      ansible.builtin.set_fact:
        __proxmox_acme_tos_url: "{{ __acme_directory_metadata.json.meta.termsOfService }}"
      run_once: true

    - name: Create ACME account
      community.proxmox.proxmox_acme_account:
        name: "{{ proxmox_acme_account.name }}"
        contact: "{{ proxmox_acme_account.contact_email }}"
        directory: "{{ __proxmox_acme_account_directory }}"
        tos: "{{ __proxmox_acme_tos_url }}"
      delegate_to: localhost
