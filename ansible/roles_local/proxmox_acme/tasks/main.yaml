---
- name: Manage Proxmox ACME configuration
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_port: "{{ proxmox_api_port }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password | default(omit, true) }}"
      api_token_id: "{{ proxmox_api_token_id | default(omit, true) }}"
      api_token_secret: "{{ proxmox_api_token_secret | default(omit, true) }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
  block:
    - name: Manage ACME account
      ansible.builtin.include_tasks: account.yaml
      loop: "{{ proxmox_acme_accounts }}"
      loop_control:
        loop_var: proxmox_acme_account
        label: "{{ proxmox_acme_account.name }}"
      when: (_proxmox_is_primary_node | default(true) | bool) or ('debug' in ansible_run_tags)
      tags: [account, debug]

    - name: Manage ACME DNS plugin
      ansible.builtin.include_tasks: plugin.yaml
      loop: "{{ proxmox_acme_dns_plugins }}"
      loop_control:
        loop_var: proxmox_acme_dns_plugin
        label: "{{ proxmox_acme_dns_plugin.name }}"
      when: (_proxmox_is_primary_node | default(true) | bool) or ('debug' in ansible_run_tags)
      tags: [plugin, debug]

    - name: Manage ACME certificate
      ansible.builtin.include_tasks: certificate.yaml
      loop: "{{ proxmox_acme_certificates }}"
      loop_control:
        loop_var: proxmox_acme_certificate
        label: "{{ proxmox_acme_certificate.domain }}"
      tags: [certificate, debug]
