---
- name: Include proxmox_base role
  ansible.builtin.include_role:
    name: proxmox_base
  when: not (_proxmox_api_working | default(false) | bool)
  tags: [always]

- name: Manage Proxmox PVE accounts, roles, and ACLs
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_port: "{{ proxmox_api_port }}"
      api_user: "{{ proxmox_api_user }}"
      api_password: "{{ proxmox_api_password if (proxmox_api_password | default('') | length > 0) else omit }}"
      api_token_id: "{{ proxmox_api_token_id if (proxmox_api_token_id | default('') | length > 0) else omit }}"
      api_token_secret: "{{ proxmox_api_token_secret if (proxmox_api_token_secret | default('') | length > 0) else omit }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
  block:
    - name: Manage Proxmox roles
      ansible.builtin.include_tasks: roles.yaml
      when: (_proxmox_is_primary_node | default(true) | bool) or ('debug' in ansible_run_tags)
      tags: [roles, checks, debug]

    - name: Manage Proxmox users and API tokens
      ansible.builtin.include_tasks: users.yaml
      when: (_proxmox_is_primary_node | default(true) | bool) or ('debug' in ansible_run_tags)
      tags: [users, tokens, checks, debug]

    - name: Manage Proxmox ACLs
      ansible.builtin.include_tasks: acls.yaml
      when: (_proxmox_is_primary_node | default(true) | bool) or ('debug' in ansible_run_tags)
      tags: [acls, checks, debug]
