---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ansible_facts['virtualization_type'] | default('') not in ['docker', 'podman', 'container']

- name: Restart zswap service
  ansible.builtin.systemd_service:
    name: "zswap.service"
    state: "restarted"
    daemon_reload: true
  when:
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'podman', 'container']
    - not ansible_check_mode

- name: Reload sysctl
  ansible.builtin.command:
    cmd: "sysctl --system"
  changed_when: true
  when:
    - linux_base_sysctl_reload | bool
    - ansible_facts['virtualization_type'] | default('') not in ['docker', 'podman', 'container']

- name: Notify reboot skipped
  ansible.builtin.debug:
    msg: "Reboot skipped: 'linux_base_reboot_enabled' is false. Reboot manually to apply system changes."
  listen: "Reboot host"
  when: not (linux_base_reboot_enabled | bool)

- name: Reboot host one by one
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible linux_base role"
    reboot_timeout: "{{ linux_base_reboot_timeout }}"
  throttle: 1
  listen: "Reboot host"
  when: linux_base_reboot_enabled | bool
